<form id="addProductForm" class="flex flex-col gap-5 w-full max-w-md mx-auto bg-white p-2">

  <!-- Campo: Nombre del Producto -->
  <div class="flex flex-col gap-1.5">
    <label for="prodName" class="text-sm font-semibold text-gray-700">Nombre del Producto *</label>
    <input
      type="text"
      id="prodName"
      name="name"
      required
      placeholder="Ej. Camisa Oxford Azul"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
    >
  </div>

  <!-- Fila doble: Precio y Stock -->
  <div class="grid grid-cols-2 gap-4">
    <!-- Precio -->
    <div class="flex flex-col gap-1.5">
      <label for="prodPrice" class="text-sm font-semibold text-gray-700">Precio ($) *</label>
      <input
        type="number"
        id="prodPrice"
        name="price"
        required
        min="0"
        step="0.01"
        placeholder="0.00"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
      >
    </div>

    <!-- Stock -->
    <div class="flex flex-col gap-1.5">
      <label for="prodStock" class="text-sm font-semibold text-gray-700">Stock Inicial</label>
      <input
        type="number"
        id="prodStock"
        name="stock"
        min="0"
        placeholder="10"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
      >
    </div>
  </div>

  <!-- Campo: Categoría -->
  <div class="flex flex-col gap-1.5">
    <label for="prodCategory" class="text-sm font-semibold text-gray-700">Categoría</label>
    <select
      id="prodCategory"
      name="category"
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm shadow-sm bg-white text-gray-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
    >
      <option value="">Selecciona una categoría</option>
      <option value="clothing">Ropa / Textil</option>
      <option value="electronics">Electrónica</option>
      <option value="home">Hogar</option>
      <option value="other">Otros</option>
    </select>
  </div>

  <!-- Campo: Descripción -->
  <div class="flex flex-col gap-1.5">
    <label for="prodDescription" class="text-sm font-semibold text-gray-700">Descripción corta</label>
    <textarea
      id="prodDescription"
      name="description"
      rows="3"
      placeholder="Detalles del producto, materiales, etc..."
      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm shadow-sm placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors resize-y"
    ></textarea>
  </div>

  <!-- Botones de Acción -->
  <div class="flex justify-end gap-3 mt-2">
    <button
      type="button"
      id="btnCancel"
      class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 focus:outline-none transition-colors"
    >
      Cancelar
    </button>
    <button
      type="submit"
      class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 focus:outline-none transition-colors shadow-sm"
    >
      Guardar Producto
    </button>
  </div>

</form>
