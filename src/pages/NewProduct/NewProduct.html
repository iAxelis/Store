<form id="addProductForm" class="flex flex-col gap-5 w-full max-w-md mx-auto bg-white p-2">

  <div class="flex flex-col gap-1.5">
    <label for="prodName" class="text-sm font-semibold text-slate-700">Nombre del Producto *</label>
    <input
      type="text"
      id="prodName"
      name="name"
      required
      placeholder="Ej. Cuaderno Profesional Scribe"
      class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
    >
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div class="flex flex-col gap-1.5">
      <label for="prodPrice" class="text-sm font-semibold text-slate-700">Precio ($) *</label>
      <input
        type="number"
        id="prodPrice"
        name="price"
        required
        min="0"
        step="0.01"
        placeholder="0.00"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
      >
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="prodStock" class="text-sm font-semibold text-slate-700">Stock Inicial</label>
      <input
        type="number"
        id="prodStock"
        name="stock"
        min="0"
        placeholder="10"
        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
      >
    </div>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="prodCategory" class="text-sm font-semibold text-slate-700">Categoría</label>
    <select
      id="prodCategory"
      name="category"
      class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm bg-white text-slate-700 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all"
    >
      <option value="">Selecciona una categoría</option>
      <option value="stationery">Papelería</option>
      <option value="electronics">Electrónica</option>
      <option value="other">Otros</option>
    </select>
  </div>

  <div class="flex flex-col gap-1.5">
    <label for="prodDescription" class="text-sm font-semibold text-slate-700">Descripción corta</label>
    <textarea
      id="prodDescription"
      name="description"
      rows="3"
      placeholder="Detalles del producto..."
      class="w-full px-4 py-2.5 border border-gray-200 rounded-xl text-sm placeholder-gray-400 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all resize-y"
    ></textarea>
  </div>

  <div class="flex justify-end gap-3 mt-4">
    <button
      type="button"
      (click)="cancelar()"
      class="px-5 py-3 text-sm font-medium text-slate-600 bg-gray-100 hover:bg-gray-200 rounded-2xl transition duration-200"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="px-5 py-3 text-sm font-semibold text-white bg-cyan-500 hover:bg-cyan-600 active:bg-cyan-700 rounded-2xl transition duration-200 shadow-md shadow-cyan-500/10 tracking-wide"
    >
      Guardar Producto
    </button>
  </div>

</form>
