<div class="m-8 flex justify-center">
  <div class="max-w-xl w-full flex flex-col gap-5">

    <div class="flex justify-end">
      <button
        (click)="openModal()"
        class="flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-emerald-600 rounded-xl hover:bg-emerald-500 active:bg-emerald-700 transition-all duration-200 shadow-md shadow-emerald-600/20 tracking-wide"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Agregar Producto
      </button>
    </div>

    <div class="overflow-hidden rounded-xl border border-slate-200/80 shadow-lg shadow-slate-100/50">
      <table class="w-full border-collapse bg-white text-left text-sm text-slate-600">
        <thead class="bg-slate-900 text-slate-200">
          <tr>
            <th class="px-6 py-4 font-semibold tracking-wider uppercase text-xs">Producto</th>
            <th class="px-6 py-4 font-semibold tracking-wider uppercase text-xs text-center">Cantidad</th>
            <th class="px-6 py-4 font-semibold tracking-wider uppercase text-xs text-right">Precio</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
          <tr class="hover:bg-slate-50/80 transition-colors">
            <td class="px-6 py-4.5 font-medium text-slate-900">Manzanas</td>
            <td class="px-6 py-4.5 text-center font-mono text-slate-500">10</td>
            <td class="px-6 py-4.5 text-right font-semibold text-emerald-600">$5.00</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>
</div>

@if (isModalOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-md">

    <div class="bg-white rounded-2xl p-7 shadow-2xl w-full max-w-md mx-4 relative border border-slate-100">

      <button
        (click)="closeModal()"
        class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors text-xl font-medium leading-none"
      >
        &times;
      </button>

      <h3 class="text-xl font-bold text-slate-950 mb-6 tracking-tight">Agregar Nuevo Producto</h3>

      <app-new-product></app-new-product>

    </div>
  </div>
}
